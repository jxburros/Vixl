<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tidewick Café menu</title>
<style>
@page { size: 8.5in 14in; margin: 0; }
:root { --navy:#14263b; --amber:#f2a541; --amberdk:#b8730f; --cream:#f7f1e5; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 8.5in; height: 14in; background: #fff; }
body { font-family: "P052", "Palatino Linotype", serif; color: var(--navy);
  -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { position: absolute; left: 0.5in; top: 0.5in; width: 7.5in; height: 13in;
  border: 2pt solid var(--navy); padding: 4pt; }
.inner { height: 100%; border: 0.75pt solid var(--navy); display: flex; flex-direction: column; }
header { background: var(--navy); color: var(--cream); text-align: center; padding: 0.42in 0.4in 0.36in; }
.mark { width: 44pt; height: 22pt; margin: 0 auto 8pt; display:block; }
h1 { font-weight: normal; font-size: 54pt; letter-spacing: 1.5pt; line-height: 1; }
.tagline { font-style: italic; font-size: 17pt; color: var(--amber); margin-top: 10pt; letter-spacing: .5pt; }
main { flex: 1; padding: 0.3in 0.85in 0; display: flex; flex-direction: column; justify-content: space-between; }
section h2 { font-family: "URW Gothic", "Nimbus Sans", sans-serif; font-weight: 600; font-size: 14pt;
  letter-spacing: 4pt; color: var(--navy); display: flex; align-items: center; gap: 10pt; margin-bottom: 6pt; }
section h2::after { content: ""; flex: 1; height: 1.25pt; background: var(--amber); }
.item { display: flex; align-items: baseline; font-size: 13.5pt; line-height: 1.55; }
.name { white-space: nowrap; }
.tag { font-family: "URW Gothic", sans-serif; font-size: 9.5pt; font-weight: 600; color: var(--amberdk); letter-spacing: .5pt; margin-left: 3pt; }
.lead { flex: 1; border-bottom: 1.6pt dotted rgba(20,38,59,.45); margin: 0 6pt; transform: translateY(-3pt); min-width: 18pt; }
.price { width: 0.62in; text-align: right; font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.desc { font-style: italic; font-size: 11pt; line-height: 1.3; color: #3c4b5e; margin: -1pt 0.75in 6pt 14pt; }
.seasonal { background: var(--cream); margin: 0 -0.3in; padding: 10pt 0.3in 4pt calc(0.3in - 3pt); border-left: 3pt solid var(--amber); }
.note { font-style: italic; font-size: 11pt; color: #3c4b5e; text-align: right; margin-top: 2pt; }
.key { text-align: center; font-size: 11pt; margin-top: 4pt; }
.key b { font-family: "URW Gothic", sans-serif; font-weight: 600; color: var(--amberdk); }
footer { margin-top: 0.22in; background: var(--navy); color: var(--cream); text-align: center;
  font-size: 11.5pt; padding: 11pt 0.3in; letter-spacing: .3pt; }
footer .sep, .key .sep { color: var(--amber); padding: 0 4pt; }
</style></head>
<body><div class="page"><div class="inner">
<header>
  <svg class="mark" viewBox="0 0 44 22" aria-hidden="true"><path d="M2 14 q5 -6 10 0 t10 0 t10 0 t10 0" fill="none" stroke="#f2a541" stroke-width="2.2" stroke-linecap="round"/><path d="M8 20 q5 -4 10 0 t10 0 t10 0" fill="none" stroke="#f7f1e5" stroke-width="1.4" stroke-linecap="round" opacity=".7"/><circle cx="22" cy="5" r="3" fill="#f2a541"/></svg>
  <h1>Tidewick Café</h1>
  <p class="tagline">Coffee by the harbor</p>
</header>
<main id="main"></main>
<footer>Mon–Fri 7 am–6 pm<span class="sep">·</span>Sat–Sun 8 am–5 pm<span class="sep">·</span>12 Quay Street, Port Ellery</footer>
</div></div>
<script>
const M = [
 ["COFFEE",[["Espresso","3.25"],["Macchiato","3.75"],["Cortado","4.25"],["Flat white","5.00"],["Cappuccino","5.00"],["Latte","5.25"],["Crème brûlée latte","6.00"],["Drip coffee","3.00"]],"Oat milk +$0.75"],
 ["TEA",[["Earl Grey","3.25"],["Sencha","3.50"],["Matcha (ceremonial)","5.50"],["Chai latte","5.00"]]],
 ["BAKERY",[["Butter croissant","3.75"],["Pain au chocolat","4.25"],["Cardamom bun","4.50"],["Almond financier","3.50","N"],["Banana bread","4.00","V"],["Flourless chocolate cake","5.25","GF"]]],
 ["SEASONAL",[["Smoked maple latte","6.00",null,"Maple syrup smoked in-house, double ristretto, steamed milk."],["Gingerbread flat white","5.75",null,"Molasses, ginger and cinnamon with our house espresso."],["Spiced pear tart","6.50","N","Poached pear, frangipane, brown-butter crust."]]]
];
const main = document.getElementById('main');
let h = '';
for (const [sec, items, note] of M) {
  h += `<section${sec==='SEASONAL'?' class="seasonal"':''}><h2>${sec}</h2>`;
  for (const [n,p,t,d] of items) {
    h += `<div class="item"><span class="name">${n}${t?` <span class="tag">(${t})</span>`:''}</span><span class="lead"></span><span class="price">$${p}</span></div>`;
    if (d) h += `<p class="desc">${d}</p>`;
  }
  if (note) h += `<p class="note">${note}</p>`;
  h += `</section>`;
}
h += `<p class="key"><b>V</b> = vegan<span class="sep">·</span><b>GF</b> = gluten-free<span class="sep">·</span><b>N</b> = contains nuts</p>`;
main.innerHTML = h;
</script>
</body></html>
