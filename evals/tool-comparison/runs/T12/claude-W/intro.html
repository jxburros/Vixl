<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tidewick Café intro</title>
<!--
  Tidewick Café 6 s intro (1080x1080, 30 fps).
  Editable source: every element is SVG; window.renderAt(t) sets the whole scene for time t (seconds),
  so frames are deterministic. Open in a browser to watch a real-time preview loop
  (add ?t=4.2 to the URL to freeze at a given time).
-->
<style>
  html, body { margin: 0; padding: 0; background: #14263b; overflow: hidden; }
  svg { display: block; }
  .word { font-family: "P052", "Palatino Linotype", "Book Antiqua", Georgia, serif; font-weight: 700; }
  .tag  { font-family: "URW Gothic", "Century Gothic", "Avenir", sans-serif; font-weight: 400; }
</style>
</head>
<body>
<svg id="stage" width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a541" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#f2a541" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2a541" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowGrad">
      <stop offset="0" stop-color="#f2a541" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2a541" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skyGrad" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#1c3550"/>
      <stop offset="1" stop-color="#14263b"/>
    </radialGradient>
    <!-- lighthouse is only visible above this line, so it emerges from behind the sea -->
    <clipPath id="seaClip"><rect x="0" y="0" width="1080" height="800"/></clipPath>
  </defs>

  <rect width="1080" height="1080" fill="url(#skyGrad)"/>

  <!-- beam + lamp glow (behind lighthouse body) -->
  <g id="beamGroup" opacity="0">
    <g id="beam"><path d="M0,0 L900,-95 L900,95 Z" fill="url(#beamGrad)"/></g>
  </g>

  <!-- lighthouse -->
  <g clip-path="url(#seaClip)">
    <g id="lighthouse" opacity="0">
      <!-- local coordinates: lamp centre at (0,0) -->
      <circle id="glow" cx="0" cy="0" r="70" fill="url(#glowGrad)" opacity="0"/>
      <!-- tower (tapered) -->
      <path d="M-34,40 L34,40 L60,350 L-60,350 Z" fill="#f7f1e5"/>
      <!-- stripes -->
      <path d="M-39.4,105 L39.4,105 L44.4,165 L-44.4,165 Z" fill="#a8d5c8"/>
      <path d="M-49.4,225 L49.4,225 L54.5,285 L-54.5,285 Z" fill="#a8d5c8"/>
      <!-- door + window -->
      <path d="M-11,350 L-11,318 Q0,306 11,318 L11,350 Z" fill="#14263b"/>
      <rect x="-6" y="200" width="12" height="18" rx="6" fill="#14263b"/>
      <!-- gallery -->
      <rect x="-50" y="30" width="100" height="12" rx="3" fill="#f7f1e5"/>
      <!-- lantern room -->
      <rect x="-24" y="-20" width="48" height="50" fill="#14263b"/>
      <rect id="lamp" x="-18" y="-15" width="36" height="40" rx="3" fill="#f2a541"/>
      <rect x="-2" y="-15" width="4" height="40" fill="#14263b" opacity="0.5"/>
      <!-- roof -->
      <path d="M-34,-18 L34,-18 L0,-58 Z" fill="#f7f1e5"/>
      <circle cx="0" cy="-62" r="6" fill="#f7f1e5"/>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <text id="wordmark" class="word" x="680" y="520" font-size="96" text-anchor="middle" fill="#f7f1e5" opacity="0">Tidewick Café</text>
  <text id="tagline" class="tag" x="680" y="590" font-size="40" text-anchor="middle" fill="#f2a541" letter-spacing="3"></text>

  <!-- waves (back to front) -->
  <path id="wave0" fill="#4f6c73"/>
  <path id="wave1" fill="#7ca19d"/>
  <path id="wave2" fill="#a8d5c8"/>
  <path id="crest2" fill="none" stroke="#f7f1e5" stroke-width="5" stroke-linecap="round"/>
</svg>

<script>
const LH_X = 210, LH_Y = 400;          // lamp position on stage
const TAG = "Coffee by the harbor";

const clamp01 = v => Math.max(0, Math.min(1, v));
const prog = (t, a, b) => clamp01((t - a) / (b - a));
const easeInOut = p => p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;   // cubic
const easeOut = p => 1 - Math.pow(1 - p, 3);

// tagline: one tspan per character so centring never shifts while letters appear
const tagEl = document.getElementById('tagline');
const tagSpans = [...TAG].map(ch => {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
  s.textContent = ch; s.setAttribute('opacity', '0'); tagEl.appendChild(s); return s;
});

// three wave layers
const WAVES = [
  { base: 760, amp: 16, k: 2*Math.PI/420, speed: 0.55, phase: 0.0, t0: 0.00, t1: 1.00 },
  { base: 835, amp: 20, k: 2*Math.PI/360, speed: -0.75, phase: 1.7, t0: 0.25, t1: 1.25 },
  { base: 915, amp: 22, k: 2*Math.PI/300, speed: 0.95, phase: 3.1, t0: 0.50, t1: 1.50 },
];
function waveY(w, x, t) {
  return w.base + w.amp * Math.sin(w.k * x + w.phase + w.speed * t)
                + w.amp * 0.35 * Math.sin(w.k * 2.3 * x - w.phase + w.speed * 1.6 * t);
}
function wavePath(w, t, reveal, closed) {
  if (reveal <= 0) return "";
  const xEnd = -20 + reveal * 1120;   // from just off-canvas left to just off-canvas right
  let d = "";
  for (let x = -20; x <= xEnd + 0.01; x += 8) {
    const xx = Math.min(x, xEnd);
    d += (d ? " L" : "M") + xx.toFixed(1) + "," + waveY(w, xx, t).toFixed(1);
  }
  d += " L" + xEnd.toFixed(1) + "," + waveY(w, xEnd, t).toFixed(1);
  if (closed) d += ` L${xEnd.toFixed(1)},1100 L-20,1100 Z`;
  return d;
}

function renderAt(t) {
  // waves: draw in left to right, staggered, eased
  WAVES.forEach((w, i) => {
    const r = easeInOut(prog(t, w.t0, w.t1));
    document.getElementById('wave' + i).setAttribute('d', wavePath(w, t, r, true));
    if (i === 2) {
      const crestW = { ...w, base: w.base + 3 };
      document.getElementById('crest2').setAttribute('d', wavePath(crestW, t, r, false));
    }
  });

  // lighthouse rises 1.0-3.0 s
  const lp = easeInOut(prog(t, 1.0, 3.0));
  const lh = document.getElementById('lighthouse');
  lh.setAttribute('transform', `translate(${LH_X},${LH_Y + (1 - lp) * 460})`);
  lh.setAttribute('opacity', easeOut(prog(t, 1.0, 1.8)).toFixed(3));

  // beam from 2.0 s: fades in and sweeps back and forth (sinusoidal = eased at both ends)
  const bOn = easeInOut(prog(t, 2.0, 2.6));
  const PERIOD = 2.8;
  const ang = t < 2 ? 8 : 8 + 64 * (1 - Math.cos(2 * Math.PI * (t - 2) / PERIOD)) / 2 * 2;  // 8°..136° above horizontal (right)
  document.getElementById('beamGroup').setAttribute('opacity', bOn.toFixed(3));
  document.getElementById('beam').setAttribute('transform', `translate(${LH_X},${LH_Y + 5}) rotate(${-ang})`);
  document.getElementById('glow').setAttribute('opacity', bOn.toFixed(3));

  // wordmark 2.0-3.5 s: slide up + fade in
  const wp = easeInOut(prog(t, 2.0, 3.5));
  const wm = document.getElementById('wordmark');
  wm.setAttribute('opacity', wp.toFixed(3));
  wm.setAttribute('transform', `translate(0,${((1 - wp) * 60).toFixed(2)})`);

  // tagline 3.0-4.5 s: types on one letter at a time (each letter fades in over ~2 frames)
  const n = TAG.length, step = 1.5 / n;
  tagSpans.forEach((s, i) => {
    s.setAttribute('opacity', prog(t, 3.0 + i * step, 3.0 + i * step + 0.066).toFixed(3));
  });
}
window.renderAt = renderAt;

// live preview when opened directly (the renderer calls renderAt itself)
const q = new URLSearchParams(location.search);
if (q.has('t')) renderAt(parseFloat(q.get('t')));
else if (!q.has('render')) {
  const t0 = performance.now();
  (function loop() { renderAt(((performance.now() - t0) / 1000) % 6); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
