<!doctype html><html lang="en"><meta charset="utf-8"><title>Animation family</title>
<style>body{font:16px system-ui;margin:3rem;max-width:50rem}img{display:block;max-width:100%;height:320px;object-fit:contain}button,select{font:inherit;margin:.4rem;padding:.5rem}</style>
<h1>Animation family</h1><label>State <select id="states"></select></label><label>Theme <select id="themes"></select></label>
<img id="animation" alt=""><div id="events"></div><p id="status" aria-live="polite"></p>
<script type="application/json" id="manifest">{"format": "vixl-app-animation", "version": 1, "default_state": "ready", "themes": ["dark", "light"], "transitions": [{"from": "ready", "event": "create", "to": "creating"}, {"from": "creating", "event": "deliver", "to": "delivered"}, {"from": "delivered", "event": "reset", "to": "ready"}], "states": {"ready": {"master": "masters/ready.vixl", "loop": true, "interruptible": true, "on_complete": null, "variants": {"dark": {"animation": "assets/ready/dark.webp", "poster": "assets/ready/dark-reduced.png", "reduced_motion": "assets/ready/dark-reduced.png", "poster_time_ms": 0, "duration_ms": 1200, "width": 640, "height": 320, "variables": {"bg": "#252B39", "fg": "#FFFFFF", "accent": "#6A9AFF"}, "warnings": []}, "light": {"animation": "assets/ready/light.webp", "poster": "assets/ready/light-reduced.png", "reduced_motion": "assets/ready/light-reduced.png", "poster_time_ms": 0, "duration_ms": 1200, "width": 640, "height": 320, "variables": {"bg": "#F5F7FB", "fg": "#252B39", "accent": "#3575EE"}, "warnings": []}}}, "creating": {"master": "masters/creating.vixl", "loop": true, "interruptible": true, "on_complete": null, "variants": {"dark": {"animation": "assets/creating/dark.webp", "poster": "assets/creating/dark-reduced.png", "reduced_motion": "assets/creating/dark-reduced.png", "poster_time_ms": 0, "duration_ms": 1200, "width": 640, "height": 320, "variables": {"bg": "#252B39", "fg": "#FFFFFF", "accent": "#6A9AFF"}, "warnings": []}, "light": {"animation": "assets/creating/light.webp", "poster": "assets/creating/light-reduced.png", "reduced_motion": "assets/creating/light-reduced.png", "poster_time_ms": 0, "duration_ms": 1200, "width": 640, "height": 320, "variables": {"bg": "#F5F7FB", "fg": "#252B39", "accent": "#3575EE"}, "warnings": []}}}, "delivered": {"master": "masters/delivered.vixl", "loop": true, "interruptible": true, "on_complete": null, "variants": {"dark": {"animation": "assets/delivered/dark.webp", "poster": "assets/delivered/dark-reduced.png", "reduced_motion": "assets/delivered/dark-reduced.png", "poster_time_ms": 0, "duration_ms": 1200, "width": 640, "height": 320, "variables": {"bg": "#252B39", "fg": "#FFFFFF", "accent": "#6A9AFF"}, "warnings": []}, "light": {"animation": "assets/delivered/light.webp", "poster": "assets/delivered/light-reduced.png", "reduced_motion": "assets/delivered/light-reduced.png", "poster_time_ms": 0, "duration_ms": 1200, "width": 640, "height": 320, "variables": {"bg": "#F5F7FB", "fg": "#252B39", "accent": "#3575EE"}, "warnings": []}}}}}</script><script>
const manifest=JSON.parse(document.getElementById('manifest').textContent);
const states=document.getElementById('states'),themes=document.getElementById('themes'),picture=document.getElementById('animation');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let current=manifest.default_state,busy=false,timer;
for(const name of Object.keys(manifest.states))states.add(new Option(name,name));
for(const name of manifest.themes)themes.add(new Option(name,name));
const preferred=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
if(manifest.themes.includes(preferred))themes.value=preferred;
function select(name,force=false){
 if(!manifest.states[name])throw new Error('Unknown state: '+name);
 if(!force&&busy&&!manifest.states[current].interruptible){states.value=current;return false;}
 clearTimeout(timer);current=name;states.value=name;
 const state=manifest.states[name],variant=state.variants[themes.value];
 picture.src=reduced.matches?variant.reduced_motion:variant.animation;picture.alt=name;
 busy=!state.loop&&!reduced.matches;
 document.getElementById('status').textContent=name+(reduced.matches?' · reduced motion':'');
 if(busy)timer=setTimeout(()=>{busy=false;if(state.on_complete)select(state.on_complete,true);},variant.duration_ms);
 return true;
}
function send(event){const rule=manifest.transitions.find(r=>r.from===current&&r.event===event);return rule?select(rule.to):false;}
for(const event of new Set(manifest.transitions.map(r=>r.event))){const button=document.createElement('button');button.textContent=event;button.onclick=()=>send(event);document.getElementById('events').append(button);}
states.onchange=()=>select(states.value);themes.onchange=()=>select(current,true);reduced.addEventListener('change',()=>select(current,true));
window.VixlAnimation={send,select,state:()=>current};select(current,true);
</script></html>
