name: Release
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
        - stable
        - preview
        default: stable
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true
      app:
        description: Optional app ID; empty selects every advanced app
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/plan.yml@181636b602317ba703c3f4bf12775c34560f4efb
    with:
      toolkit-ref: 181636b602317ba703c3f4bf12775c34560f4efb
      channel: ${{ inputs.channel }}
      app: ${{ inputs.app }}
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -e ".[dev]" build
    - run: pytest -q -n auto
    - name: Verify stable tag and package versions agree
      env:
        RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['vixl'].tag }}
      run: |
        python -c "import os; from vixl import __version__; assert os.environ['RELEASE_TAG'] == 'v' + __version__"
    - run: python -m build
    - run: python distribution/package_extensions.py
    - name: Export the design catalog bundle for host applications
      run: |
        python -m vixl catalog export --out dist/vixl-catalog.json
        python -m vixl catalog schema --out dist/vixl-catalog.schema.json
        python -c "import json, jsonschema; jsonschema.validate(json.load(open('dist/vixl-catalog.json')), json.load(open('dist/vixl-catalog.schema.json')))"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: python-distributions
        path: |
          dist/*.whl
          dist/*.tar.gz
          dist/*.mcpb
          dist/*-claude-code.zip
          dist/vixl-catalog*.json
    - name: Require a pinned update signing key
      run: python -c "import sys; sys.path.append('src/vixl'); import updater_sign; sys.exit(0 if updater_sign.TRUSTED_KEYS
        else 'TRUSTED_KEYS in src/vixl/updater_sign.py is empty; see docs/reference/releases.md, Update signing')"
    needs:
    - plan
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['vixl'].selected
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['vixl'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['vixl'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: read
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -e ".[dev]" pyinstaller==6.16.0
    - run: pytest -q -n auto
    - name: Build bundled runtime, stable launcher, and installer
      shell: pwsh
      run: ./distribution/build_windows.ps1
    - name: Verify installation, PATH, native updates, and uninstall
      shell: pwsh
      run: ./distribution/test_windows_install.ps1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: windows-release
        path: dist/release/*
        if-no-files-found: error
    needs:
    - plan
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['vixl'].selected
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['vixl'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['vixl'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: read
  publish:
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['vixl'].selected
    needs:
    - plan
    - verify
    - windows
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: '*distributions'
        path: release
        merge-multiple: true
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: windows-release
        path: release
    - name: Sign the update manifest
      env:
        VIXL_UPDATE_SIGNING_KEY: ${{ secrets.VIXL_UPDATE_SIGNING_KEY }}
      run: |
        rm -f release/vixl-update.json.sig
        python distribution/sign_manifest.py release/vixl-update.json
    - name: Checksum every release asset
      working-directory: release
      run: |
        rm -f SHA256SUMS.txt
        sha256sum -- * > SHA256SUMS.txt
        cat SHA256SUMS.txt
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: JX-Holdings-LLC/release-infrastructure
        ref: 181636b602317ba703c3f4bf12775c34560f4efb
        path: .toolkit
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
    - name: Stage the complete configured release inventory
      shell: bash
      env:
        RELEASE_APP: vixl
      run: node .toolkit/src/release.mjs stage --app "$RELEASE_APP" --from release --bundle unified-bundle --sha
        "$RELEASE_SOURCE_SHA"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: bundle-vixl
        path: unified-bundle
        if-no-files-found: error
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['vixl'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['vixl'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
  pypi:
    needs:
    - plan
    - publish
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['vixl'].selected
    uses: ./.github/workflows/pypi.yml
    permissions:
      contents: read
      id-token: write
    with:
      dry-run: ${{ inputs.dry_run }}
      artifact: python-distributions
  publish-vixl:
    needs:
    - plan
    - publish
    - pypi
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['vixl'].selected
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/finish.yml@181636b602317ba703c3f4bf12775c34560f4efb
    permissions:
      contents: write
    with:
      toolkit-ref: 181636b602317ba703c3f4bf12775c34560f4efb
      source-sha: ${{ needs.plan.outputs.sha }}
      app: vixl
      security: standard
      artifact: bundle-vixl
      dry-run: ${{ inputs.dry_run }}
