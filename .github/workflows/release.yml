name: Windows installer and releases
on:
  # Pull requests build the installer only when packaging can change; test.yml runs the test suite on every PR.
  pull_request:
    paths:
      - 'distribution/**'
      - 'src/vixl/__init__.py'
      - 'src/vixl/updater*'
      - 'pyproject.toml'
      - '.github/workflows/release.yml'
  push:
    tags: ['v*']
    branches: [main]
    paths: ['src/vixl/__init__.py', 'CHANGELOG.md', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" build
      - run: pytest -q -n auto
        if: github.event_name != 'pull_request'
      - name: Verify stable tag and package versions agree
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os; from vixl import __version__; assert os.environ['RELEASE_TAG'] == 'v' + __version__"
      - run: python -m build
      - run: python distribution/package_extensions.py
      - name: Export the design catalog bundle for host applications
        # Stable asset names, so a host can fetch releases/latest/download/vixl-catalog.json.
        run: |
          python -m vixl catalog export --out dist/vixl-catalog.json
          python -m vixl catalog schema --out dist/vixl-catalog.schema.json
          python -c "import json, jsonschema; jsonschema.validate(json.load(open('dist/vixl-catalog.json')), json.load(open('dist/vixl-catalog.schema.json')))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.mcpb
            dist/*-claude-code.zip
            dist/vixl-catalog*.json
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" pyinstaller==6.16.0
      - run: pytest -q -n auto
        if: github.event_name != 'pull_request'
      - name: Build bundled runtime, stable launcher, and installer
        shell: pwsh
        run: ./distribution/build_windows.ps1
      - name: Verify installation, PATH, native updates, and uninstall
        shell: pwsh
        run: ./distribution/test_windows_install.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: dist/release/*
          if-no-files-found: error
  plan:
    # Most pushes to main touch CHANGELOG.md without a new version. Deciding here, with read-only permissions, keeps
    # those runs from asking a reviewer to approve the protected publish job only for it to find nothing to do.
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Is this version already published?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG="v$(python -c 'import ast; from pathlib import Path; tree=ast.parse(Path("src/vixl/__init__.py").read_text()); print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "__version__" for t in n.targets)))')"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_TAG" --json isDraft --jq 'select(.isDraft == false)' | grep -q .; then
            echo "Version $RELEASE_TAG is already published; nothing to approve."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  publish:
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, verify, windows]
    runs-on: ubuntu-latest
    # Protected environment: a required reviewer approves before anything is published (docs/reference/releases.md).
    # Its secrets, including the update signing key, are available only to this job.
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.tag }}
    permissions:
      contents: write
      # Starts pypi.yml for a release made from main (tags created with GITHUB_TOKEN trigger no workflows).
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*distributions'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release
          path: release
      - name: Checksum every release asset
        # The Windows job's SHA256SUMS covers only its own files; this one covers the wheel, sdist, .mcpb and plugin too.
        working-directory: release
        run: |
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish an immutable, fully uploaded stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          RELEASE_TAG="v$(python -c 'import ast; from pathlib import Path; tree=ast.parse(Path("src/vixl/__init__.py").read_text()); print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "__version__" for t in n.targets)))')"
          export RELEASE_TAG
          if gh release view "$RELEASE_TAG" --json isDraft --jq 'select(.isDraft == false)' | grep -q .; then
            echo "Version $RELEASE_TAG is already published."
            exit 0
          fi
          python - <<'PYNOTES'
          import os
          from pathlib import Path
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          notes = changelog.split(f"## {version}\n", 1)[1].split("\n## ", 1)[0].strip()
          notes += "\n\nSee [installation and release documentation](https://github.com/jxburros/Vixl/blob/" + os.environ["RELEASE_TAG"] + "/docs/reference/releases.md).\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PYNOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft --title "Vixl $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      # Tags created with GITHUB_TOKEN do not trigger the tag-push workflow.
      - name: Start Python publication for the released tag
        if: github.ref == 'refs/heads/main' && steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run pypi.yml --ref "$RELEASE_TAG"

