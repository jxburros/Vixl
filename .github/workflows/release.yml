name: Windows installer and releases
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" build
      - run: pytest -q
      - name: Verify stable tag and package versions agree
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os; from vixl import __version__; assert os.environ['RELEASE_TAG'] == 'v' + __version__"
      - run: python -m build
      - run: python distribution/package_extensions.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.mcpb
            dist/*-claude-code.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" pyinstaller==6.16.0
      - run: pytest -q
      - name: Build bundled runtime, stable launcher, and installer
        shell: pwsh
        run: ./distribution/build_windows.ps1
      - name: Verify installation, PATH, native updates, and uninstall
        shell: pwsh
        run: ./distribution/test_windows_install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*distributions'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish an immutable, fully uploaded stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYNOTES'
          import os
          from pathlib import Path
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          notes = changelog.split(f"## {version}\n", 1)[1].split("\n## ", 1)[0].strip()
          notes += "\n\nSee [installation and release documentation](https://github.com/jxburros/Vixl/blob/" + os.environ["RELEASE_TAG"] + "/docs/releases.md).\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PYNOTES
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Vixl $RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
