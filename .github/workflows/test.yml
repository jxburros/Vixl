name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new MCP, FastAPI or Starlette release that breaks the upper pins fails here before users meet it.
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
env:
  # Tests marked emoji_pack fail instead of skipping when the emoji artwork pack cannot be fetched.
  VIXL_REQUIRE_PACKS: '1'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install "ruff>=0.12"
      # Lint rules only; `ruff format` is not enforced.
      - run: ruff check
      # Every `uses:` must name a full commit SHA; Dependabot proposes the updates.
      - run: python scripts/check_workflow_pins.py
      # uv.lock must match pyproject.toml; regenerate it with `uv lock` after changing dependencies.
      - run: python -m pip install "uv>=0.5"
      - run: uv lock --check
  typecheck:
    # Strict mypy on the modules listed under [tool.mypy] in pyproject.toml; the list only grows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e . "mypy>=1.11,<3"
      - run: mypy
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # MP4/WebM export and lyric-video tests skip without ffmpeg; one job runs them.
      - name: Install ffmpeg
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -e ".[dev]"
      # Content packs (the emoji artwork) are fetched once by tests/conftest.py; the key follows the pins.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/vixl/packs
          key: vixl-packs-${{ hashFiles('src/vixl/packs.py') }}
      - run: pytest -q -n auto
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      # Size guard: the wheel was 20 MB larger when the emoji artwork shipped in it (now a content pack).
      - name: Wheel size guard (8 MB)
        run: python -c "import glob, os, sys; big = [(f, os.path.getsize(f)) for f in glob.glob('dist/*.whl') if os.path.getsize(f) > 8 * 1024 * 1024]; print(big or 'wheel size ok'); sys.exit(1 if big else 0)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vixl-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
  locked:
    # The development environment pinned by uv.lock; the matrix above keeps testing fresh resolutions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install "uv>=0.5"
      - run: uv sync --frozen --extra dev
      # Content packs (the emoji artwork) are fetched once by tests/conftest.py; the key follows the pins.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/vixl/packs
          key: vixl-packs-${{ hashFiles('src/vixl/packs.py') }}
      - run: uv run --frozen pytest -q -n auto
  sdist:
    # The source distribution carries the tests and what they read; it must stay small and its tests must run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --sdist --outdir dist
      - name: Source distribution size guard (15 MB)
        run: python -c "import glob, os, sys; big = [(f, os.path.getsize(f)) for f in glob.glob('dist/*.tar.gz') if os.path.getsize(f) > 15 * 1024 * 1024]; print(big or 'sdist size ok'); sys.exit(1 if big else 0)"
      - name: Sdist contains tests, docs and skills
        run: tar -tzf dist/*.tar.gz | grep -E '/(tests/test_distribution\.py|docs/README\.md|skills/vixl/SKILL\.md|CHANGELOG\.md)$' | wc -l | grep -qx 4
  minimum-versions:
    # Installs the lowest version each direct dependency declares, so the floors in pyproject.toml stay true, and
    # the highest the pins allow, so the private SDK attributes in src/vixl/sdk_compat.py are checked at both ends.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: lowest-direct
            python: '3.11'
          - resolution: highest
            python: '3.13'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "uv>=0.5"
      - run: uv pip install --system --resolution ${{ matrix.resolution }} -e ".[dev]"
      # Content packs (the emoji artwork) are fetched once by tests/conftest.py; the key follows the pins.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/vixl/packs
          key: vixl-packs-${{ hashFiles('src/vixl/packs.py') }}
      - run: pytest -q -n auto
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      # Content packs (the emoji artwork) are fetched once by tests/conftest.py; the key follows the pins.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/vixl/packs
          key: vixl-packs-${{ hashFiles('src/vixl/packs.py') }}
      - run: pytest -q -n auto -m visual tests/visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: visual-failures
          path: tests/visual/_failures
          if-no-files-found: ignore
  audit:
    # Blocking: a known vulnerability in a runtime dependency (the base install, no extras) fails the run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The runtime set comes from a separate environment, so pip-audit's own dependencies are not counted.
      - name: List the runtime dependencies
        run: |
          python -m venv runtime
          runtime/bin/python -m pip install .
          runtime/bin/python -m pip freeze --all | grep -v -i -E '^(vixl-engine|pip|setuptools|wheel)( |=|@)' > runtime-requirements.txt
          cat runtime-requirements.txt
      - run: python -m pip install pip-audit
      - run: pip-audit -r runtime-requirements.txt --no-deps --disable-pip --progress-spinner off
  audit-extras:
    # Advisory: the optional extras and dev tools are reported but do not fail the workflow.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,server,pdf,anthropic]" pip-audit
      - run: pip-audit --skip-editable --progress-spinner off
