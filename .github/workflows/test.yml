name: Test and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # Tests marked emoji_pack fail instead of skipping when the emoji artwork pack cannot be fetched.
  VIXL_REQUIRE_PACKS: '1'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "ruff>=0.12"
      # Lint rules only; `ruff format` is not enforced.
      - run: ruff check
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # MP4/WebM export and lyric-video tests skip without ffmpeg; one job runs them.
      - name: Install ffmpeg
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -e ".[dev]"
      # Content packs (the emoji artwork) are fetched once by tests/conftest.py; the key follows the pins.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vixl/packs
          key: vixl-packs-${{ hashFiles('src/vixl/packs.py') }}
      - run: pytest -q -n auto
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      # Size guard: the wheel was 20 MB larger when the emoji artwork shipped in it (now a content pack).
      - name: Wheel size guard (8 MB)
        run: python -c "import glob, os, sys; big = [(f, os.path.getsize(f)) for f in glob.glob('dist/*.whl') if os.path.getsize(f) > 8 * 1024 * 1024]; print(big or 'wheel size ok'); sys.exit(1 if big else 0)"
      - uses: actions/upload-artifact@v4
        with:
          name: vixl-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
  sdist:
    # The source distribution carries the tests and what they read; it must stay small and its tests must run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --sdist --outdir dist
      - name: Source distribution size guard (15 MB)
        run: python -c "import glob, os, sys; big = [(f, os.path.getsize(f)) for f in glob.glob('dist/*.tar.gz') if os.path.getsize(f) > 15 * 1024 * 1024]; print(big or 'sdist size ok'); sys.exit(1 if big else 0)"
      - name: Sdist contains tests, docs and skills
        run: tar -tzf dist/*.tar.gz | grep -E '/(tests/test_distribution\.py|docs/README\.md|skills/vixl/SKILL\.md|CHANGELOG\.md)$' | wc -l | grep -qx 4
  minimum-versions:
    # Installs the lowest version each direct dependency declares, so the floors in pyproject.toml stay true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "uv>=0.5"
      - run: uv pip install --system --resolution lowest-direct -e ".[dev]"
      # Content packs (the emoji artwork) are fetched once by tests/conftest.py; the key follows the pins.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vixl/packs
          key: vixl-packs-${{ hashFiles('src/vixl/packs.py') }}
      - run: pytest -q -n auto
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      # Content packs (the emoji artwork) are fetched once by tests/conftest.py; the key follows the pins.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vixl/packs
          key: vixl-packs-${{ hashFiles('src/vixl/packs.py') }}
      - run: pytest -q -n auto -m visual tests/visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-failures
          path: tests/visual/_failures
          if-no-files-found: ignore
  audit:
    # Advisory for now: a vulnerable dependency is reported but does not fail the workflow.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,server,pdf,anthropic]" pip-audit
      - run: pip-audit --skip-editable --progress-spinner off
