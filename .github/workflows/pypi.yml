name: Publish prebuilt Python distributions
'on':
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: true
      artifact:
        type: string
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vixl-engine
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ inputs.artifact }}
        path: dist
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: |-
        python -m pip install twine
        python -m twine check dist/*.whl dist/*.tar.gz
    - run: mkdir packages && cp dist/*.whl dist/*.tar.gz packages/
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      with:
        packages-dir: packages/
        skip-existing: true
        # Called from release.yml, the attestation names release.yml while Trusted Publishing matched pypi.yml,
        # and PyPI rejects the upload. Signed provenance returns with #756.
        attestations: false
      if: ${{ !inputs.dry-run }}
