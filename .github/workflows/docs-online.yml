name: Docs online
# The docs-executable tests with the network and automatic fonts on, so the download paths that the regular
# suite stubs (font pairings on the first text, content packs) are exercised against the real sources.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      VIXL_DOCS_ONLINE: '1'
      VIXL_AUTO_FONTS: 'on'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q -n auto -m docs
