name: Agent eval
on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      model:
        description: Claude model ID
        default: claude-opus-5-5
      effort:
        description: Effort (low, medium, high, xhigh, max; empty = model default)
        default: ''
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Verify offline reference against stored baseline
        run: python -m evals.run --baseline evals/baseline.json --out reference-results
      - name: Run the agent eval (spends API credits)
        if: env.ANTHROPIC_API_KEY != ''
        env:
          MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
          EFFORT: ${{ inputs.effort }}
        run: |
          args=(--agent claude --model "$MODEL" --baseline evals/baseline.json --out eval-results --keep)
          if [ -n "$EFFORT" ]; then args+=(--effort "$EFFORT"); fi
          python -m evals.run "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Explain unavailable live evaluation
        if: env.ANTHROPIC_API_KEY == ''
        run: echo 'Live agent eval skipped — configure ANTHROPIC_API_KEY. Offline baseline was checked.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: agent-eval
          path: |
            eval-results
            reference-results
