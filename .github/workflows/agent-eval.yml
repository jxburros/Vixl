name: Agent eval
on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      model:
        description: Claude model ID
        default: claude-opus-5-5
      effort:
        description: Effort (low, medium, high, xhigh, max; empty = model default)
        default: ''
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        schema: [full, slim]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Verify offline reference against stored baseline
        run: python -m evals.run --schema '${{ matrix.schema }}' --tools core --baseline evals/baseline.json --out reference-results
      - name: Run the agent eval (spends API credits)
        if: env.ANTHROPIC_API_KEY != ''
        env:
          MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
          EFFORT: ${{ inputs.effort }}
          SCHEMA: ${{ matrix.schema }}
        run: |
          args=(--agent claude --model "$MODEL" --schema "$SCHEMA" --tools core --baseline evals/baseline.json --out eval-results --keep)
          if [ -n "$EFFORT" ]; then args+=(--effort "$EFFORT"); fi
          python -m evals.run "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Explain unavailable live evaluation
        if: env.ANTHROPIC_API_KEY == ''
        run: echo 'Live agent eval skipped — configure ANTHROPIC_API_KEY. Offline baseline was checked.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-${{ matrix.schema }}
          path: |
            eval-results
            reference-results
