name: Release version validation
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  versions:
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/validate.yml@d7f42f9910c075ef34915fa2b95cf28dd2be534a
    with:
      toolkit-ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
  install-pins:
    # The README, getting-started, the CI action example and .mcp.json pin distribution/published.json; this fails
    # when that version is not on PyPI or has no release tag, so a new user's first command always resolves.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python scripts/published_pins.py --online
