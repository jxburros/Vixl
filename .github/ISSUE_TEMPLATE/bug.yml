name: Bug report
description: Something renders, validates or behaves wrongly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Vixl version
      description: Output of `vixl --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`, or "Windows installer" if you use the bundled runtime.
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [CLI, MCP server, REST server, Python API]
    validations:
      required: true
  - type: textarea
    id: batch
    attributes:
      label: Minimal batch or command
      description: The smallest operations batch (JSON) or command line that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error code and message, or attach the rendered image.
    validations:
      required: true
