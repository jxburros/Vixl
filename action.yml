name: Vixl document check
description: Check .vixl documents with vixl check --all, optionally pixel-diff them against the base branch, and report the results as a summary, annotations, JUnit or SARIF.
branding:
  icon: image
  color: purple

inputs:
  paths:
    description: Globs of documents to check, separated by spaces or newlines.
    default: "**/*.vixl"
  group:
    description: A project group to check (its members plus the group consistency checks) instead of, or as well as, paths.
    default: ""
  checks:
    description: vixl check names to run (space-separated); empty runs the standard checks.
    default: ""
  suite:
    description: Path to a check-suite JSON file to run on every document as well. Suites attached to a document always run.
    default: ""
  fail-on:
    description: "Fail the step at this level: error, warning, fix (any finding that needs a fix), review (fix or review findings) or never. Empty: the profile's fail_on with a profile, else error."
    default: ""
  profile:
    description: Check profile (draft, review, final or one from the workspace's .vixl-checks.json); its checks, suites and fail_on apply.
    default: ""
  vixl-version:
    description: vixl-engine version to install from PyPI (0.25.0 or later); empty installs the version at this action's ref.
    default: ""
  compare-base:
    description: On pull requests, render each document's base-branch version and pixel-diff it (true or false).
    default: "false"
  changed-only:
    description: On pull requests, check only the documents that changed against the base branch (true or false).
    default: "false"
  proof:
    description: Write a proof page (thumbnails, findings, before/after) and upload it as the vixl-proof artifact (true or false).
    default: "false"
  annotations:
    description: Print findings as workflow annotations on the changed files (true or false).
    default: "true"
  formats:
    description: "Report files to write into .vixl-ci/ (space-separated): json, markdown, junit, sarif, github."
    default: "json"
  sarif:
    description: Upload the findings to GitHub code scanning as SARIF (true or false; the job needs security-events write permission).
    default: "false"
  python-version:
    description: Python version to run Vixl with.
    default: "3.12"

outputs:
  summary:
    description: Path of the Markdown summary file.
    value: ${{ steps.check.outputs.summary }}
  report:
    description: Path of the JSON report (when formats includes json).
    value: ${{ steps.check.outputs.report }}
  sarif:
    description: Path of the SARIF file (when formats includes sarif or sarif is true).
    value: ${{ steps.check.outputs.sarif }}
  junit:
    description: Path of the JUnit XML file (when formats includes junit).
    value: ${{ steps.check.outputs.junit }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Vixl
      shell: bash
      env:
        VIXL_VERSION: ${{ inputs.vixl-version }}
      run: |
        if [ -n "$VIXL_VERSION" ]; then
          python -m pip install "vixl-engine[pdf]==$VIXL_VERSION"
        else
          python -m pip install "${{ github.action_path }}[pdf]"
        fi
    - name: Fetch the base revision
      if: (inputs.compare-base == 'true' || inputs.changed-only == 'true') && github.event_name == 'pull_request'
      shell: bash
      run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
    - name: Check documents
      id: check
      shell: bash
      env:
        VIXL_PATHS: ${{ inputs.paths }}
        VIXL_GROUP: ${{ inputs.group }}
        VIXL_CHECKS: ${{ inputs.checks }}
        VIXL_SUITE: ${{ inputs.suite }}
        VIXL_FAIL_ON: ${{ inputs.fail-on }}
        VIXL_PROFILE: ${{ inputs.profile }}
        VIXL_BASE: ${{ inputs.compare-base == 'true' && github.event.pull_request.base.sha || '' }}
        VIXL_CHANGED: ${{ inputs.changed-only == 'true' && github.event.pull_request.base.sha || '' }}
        VIXL_PROOF: ${{ inputs.proof }}
        VIXL_ANNOTATIONS: ${{ inputs.annotations }}
        VIXL_FORMATS: ${{ inputs.formats }}
        VIXL_SARIF: ${{ inputs.sarif }}
      run: |
        set +e -f
        mkdir -p .vixl-ci
        globs="$VIXL_PATHS"
        # A group alone checks its members; the default paths would add every other document.
        [ -n "$VIXL_GROUP" ] && [ "$VIXL_PATHS" = "**/*.vixl" ] && globs=""
        args=(check --all $globs --format markdown --no-history --overwrite --work .vixl-ci)
        # An empty fail-on leaves the level to the profile (its fail_on), else error.
        [ -n "$VIXL_FAIL_ON" ] && args+=(--fail-on "$VIXL_FAIL_ON")
        [ -n "$VIXL_PROFILE" ] && args+=(--profile "$VIXL_PROFILE")
        [ -n "$VIXL_GROUP" ] && args+=(--group "$VIXL_GROUP")
        [ -n "$VIXL_CHECKS" ] && args+=(--checks $VIXL_CHECKS)
        [ -n "$VIXL_SUITE" ] && args+=(--suite "$VIXL_SUITE")
        [ -n "$VIXL_BASE" ] && args+=(--base "$VIXL_BASE")
        [ -n "$VIXL_CHANGED" ] && args+=(--changed-since "$VIXL_CHANGED")
        [ "$VIXL_PROOF" = "true" ] && args+=(--write proof=.vixl-ci/proof.html)
        [ "$VIXL_ANNOTATIONS" = "true" ] && args+=(--write github=.vixl-ci/annotations.txt)
        [ "$VIXL_SARIF" = "true" ] && VIXL_FORMATS="$VIXL_FORMATS sarif"
        for format in $VIXL_FORMATS; do
          case "$format" in
            json) args+=(--write json=.vixl-ci/report.json); echo "report=.vixl-ci/report.json" >> "$GITHUB_OUTPUT" ;;
            markdown) args+=(--write markdown=.vixl-ci/report.md) ;;
            junit) args+=(--write junit=.vixl-ci/junit.xml); echo "junit=.vixl-ci/junit.xml" >> "$GITHUB_OUTPUT" ;;
            sarif) args+=(--write sarif=.vixl-ci/vixl.sarif); echo "sarif=.vixl-ci/vixl.sarif" >> "$GITHUB_OUTPUT" ;;
            github) args+=(--write github=.vixl-ci/annotations.txt) ;;
            *) echo "Unknown format: $format" >&2; exit 2 ;;
          esac
        done
        python -m vixl "${args[@]}" > .vixl-ci-summary.md
        status=$?
        cat .vixl-ci-summary.md
        cat .vixl-ci-summary.md >> "$GITHUB_STEP_SUMMARY"
        if [ "$VIXL_ANNOTATIONS" = "true" ] && [ -f .vixl-ci/annotations.txt ]; then
          cat .vixl-ci/annotations.txt
        fi
        echo "summary=.vixl-ci-summary.md" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"
    - name: Upload proof page
      if: always() && inputs.proof == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: vixl-proof
        path: .vixl-ci/
        if-no-files-found: ignore
    - name: Upload SARIF
      if: always() && inputs.sarif == 'true' && steps.check.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.check.outputs.sarif }}
        category: vixl
    - name: Report result
      if: steps.check.outputs.status != '0'
      shell: bash
      run: |
        echo "Vixl checks failed (fail-on '${{ inputs.fail-on }}', profile '${{ inputs.profile }}'); see the job summary."
        exit 1
