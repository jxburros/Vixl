[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vixl-engine"
dynamic = ["version"]
description = "A headless image-document engine designed for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "Pillow>=11.3,<13", "numpy>=2.0,<3", "httpx>=0.28,<1", "filelock>=3.21,<4", "jsonschema>=4.23,<5", "fonttools>=4.59,<5", "uharfbuzz>=0.52,<1", "python-bidi>=0.6.6,<1", "resvg-py>=0.5,<1", "shapely>=2.1.2,<3"]

[project.optional-dependencies]
pdf = ["pypdfium2>=4.30,<6"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
mcp = ["mcp>=1.12,<2"]
anthropic = ["anthropic>=1.11,<2"]
dev = ["pypdfium2>=4.30,<6", "pypdf>=5,<7", "python-pptx>=1.0,<2", "pytest>=8,<10", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.12,<2", "anthropic>=1.11,<2", "ruff>=0.12"]

[project.scripts]
vixl = "vixl.cli:main"

[tool.hatch.version]
path = "src/vixl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vixl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "visual: golden-image render tests in tests/visual (references generated on Linux; skipped elsewhere unless VIXL_VISUAL=1)",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
