[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vixl-engine"
dynamic = ["version"]
description = "A headless image-document engine designed for autonomous AI agents"
readme = "README.md"
license = "LicenseRef-PolyForm-Small-Business-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["image", "graphics", "design", "layers", "svg", "pdf", "mcp", "ai-agents", "automation", "animation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=1.12,<2", "Pillow>=11.3,<13", "numpy>=2.0,<3", "httpx>=0.28,<1", "filelock>=3.21,<4", "jsonschema>=4.23,<5", "fonttools>=4.59,<5", "uharfbuzz>=0.52,<1", "python-bidi>=0.6.6,<1", "resvg-py>=0.5,<1", "shapely>=2.1.2,<3", "segno>=1.6,<2"]

[project.optional-dependencies]
pdf = ["pypdfium2>=4.30,<6"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
# Kept so existing `pip install "vixl-engine[mcp]"` commands keep working; MCP is in the base package.
mcp = ["mcp>=1.12,<2"]
anthropic = ["anthropic>=1.11,<2"]
dev = ["pypdfium2>=4.30,<6", "pypdf>=5,<7", "python-pptx>=1.0,<2", "pytest>=8,<10", "pytest-xdist>=3.6,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.12,<2", "anthropic>=1.11,<2", "ruff>=0.12"]

[project.urls]
Homepage = "https://github.com/jxburros/Vixl"
Documentation = "https://github.com/jxburros/Vixl/tree/main/docs"
Repository = "https://github.com/jxburros/Vixl"
Issues = "https://github.com/jxburros/Vixl/issues"
Changelog = "https://github.com/jxburros/Vixl/blob/main/CHANGELOG.md"

[project.scripts]
vixl = "vixl.cli:main"

[tool.hatch.version]
path = "src/vixl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vixl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docs: run the vixl commands and JSON operation blocks in docs/ and skills/ (tests/test_docs_executable.py; part of the default run)",
    "visual: golden-image render tests in tests/visual (references generated on Linux; skipped elsewhere unless VIXL_VISUAL=1)",
    "perf: time budgets for large documents in tests/test_perf.py (part of the default run; each takes a few seconds)",
]

[tool.ruff]
line-length = 110
# One-off generator scripts for explorations and the demo film are not maintained code.
extend-exclude = ["explorations", "movie"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
